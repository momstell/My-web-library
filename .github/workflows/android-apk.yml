name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android-wrapper/**"
      - "patch-v24.js"
      - "patch-v25.js"
      - "patch-v26.js"
      - "patch-v27.js"
      - "patch-v28.js"
      - "patch-v29.js"
      - "patch-v11.js"
      - "commercial-cover-studio.js"
      - "commercial-preview.html"
      - "cover-art/**"
      - "app-v20.html"
      - "sw.js"
      - "manifest.webmanifest"
      - "library-icon-v48.webp"
      - ".github/workflows/android-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Validate updated browser JavaScript
        run: |
          node --check patch-v11.js
          node --check patch-v29.js
          node --check commercial-cover-studio.js
          count=$(find cover-art -maxdepth 1 -type f -name '*.webp' | wc -l)
          test "$count" -eq 101

      - name: Probe cover resolver (public test work)
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import urllib.parse, urllib.request, json
          base='https://ncbdmzuwhphdstxcahxk.supabase.co/functions/v1/library-cover-resolver'
          url='https://series.naver.com/novel/detail.series?productNo=14054024'
          query=urllib.parse.urlencode({'url':url,'title':'친애하는 교수님께 [단행본]'})
          try:
              with urllib.request.urlopen(base+'?'+query, timeout=25) as response:
                  data=json.load(response)
              print('cover_probe_status=', 'valid_image' if data.get('coverDataUrl','').startswith('data:image/') else 'no_image')
          except Exception as error:
              print('cover_probe_status=unavailable',str(error)[:100])
          PY

      - name: Build debug APK
        run: gradle -p android-wrapper assembleDebug

      - name: Verify isolated package and bundled cover gallery
        run: |
          apk=android-wrapper/app/build/outputs/apk/debug/app-debug.apk
          count=$(unzip -Z1 "$apk" | grep -Ec '^assets/cover-art/[0-9]{2,3}\.webp$')
          test "$count" -eq 101
          unzip -Z1 "$apk" | grep -Fq "res/mipmap-mdpi-v4/ic_launcher.webp"
          unzip -Z1 "$apk" | grep -Fq "res/mipmap-xxxhdpi-v4/ic_launcher.webp"
          aapt=$(find "$ANDROID_HOME/build-tools" -type f -name aapt -executable | sort -V | tail -n 1)
          badging=$("$aapt" dump badging "$apk")
          echo "$badging" | grep -F "package: name='com.momstell.myweblibrary.v524test'"
          echo "$badging" | grep -F "application-icon-160:'res/mipmap-mdpi-v4/ic_launcher.webp'"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cover-studio-v5.2.4-launcher-icon-fix-debug
          path: android-wrapper/app/build/outputs/apk/debug/app-debug.apk
