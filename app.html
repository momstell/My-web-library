<style>
:root{--bg:#f5f6fb;--card:#fff;--ink:#1b1d27;--muted:#747985;--line:#e7e9f0;--p:#655bff;--p2:#8d66ff;--shadow:0 8px 24px rgba(25,29,45,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.hero{background:linear-gradient(135deg,#171a2a,#292d43 58%,#362e70);color:#fff;padding:28px 18px 24px}.wrap{max-width:980px;margin:auto}.brand{display:flex;align-items:center;gap:12px}.logo{width:48px;height:48px;border-radius:15px;background:linear-gradient(135deg,#8f79ff,#5d50ff);display:grid;place-items:center;font-weight:900;font-size:20px;box-shadow:0 10px 26px rgba(104,85,255,.35)}h1{font-size:26px;margin:0;letter-spacing:-.7px}.sub{font-size:12px;color:#c7cad8;margin-top:4px}.searchrow{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:24px}.search{height:54px;border:0;border-radius:16px;padding:0 16px;font-size:16px;outline:none}.primary{border:0;border-radius:14px;padding:0 18px;background:linear-gradient(135deg,var(--p),var(--p2));color:#fff;font-weight:800}.main{padding:18px;max-width:980px;margin:auto}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 15px}.num{font-size:24px;font-weight:900}.lab{font-size:12px;color:var(--muted);margin-top:4px}.notice{margin-top:14px;background:#fff;border:1px solid #dedbff;border-radius:16px;padding:13px 14px;font-size:12px;color:#666c79;line-height:1.55}.notice b{color:#272a35}.filters,.tools{display:flex;gap:7px;flex-wrap:wrap}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:20px 0 12px;flex-wrap:wrap}.chip,.ghost{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;color:#555b69;font-size:13px;font-weight:700}.chip.on{background:#1d202d;color:#fff;border-color:#1d202d}.ghost{border-radius:11px}.titlebar{display:flex;justify-content:space-between;align-items:end;margin:18px 0 10px}.titlebar h2{margin:0;font-size:19px}.count{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;display:grid;grid-template-columns:70px 1fr;gap:13px;box-shadow:0 4px 12px rgba(25,29,45,.035)}.cover{width:70px;height:96px;border-radius:11px;overflow:hidden;position:relative;background:linear-gradient(145deg,#b37bc4,#603253);color:white;display:flex;align-items:flex-end;padding:8px;font-weight:900;font-size:13px;line-height:1.18}.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.cover span{position:relative;z-index:2;text-shadow:0 1px 5px rgba(0,0,0,.35)}.meta{min-width:0}.ttl{font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.author{font-size:12px;color:var(--muted);margin-top:4px}.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:9px}.badge{font-size:11px;font-weight:800;padding:5px 7px;border-radius:8px;background:#f1f2f6;color:#505564}.ridi{background:#eaf1ff;color:#1d5bd1}.series{background:#eaffea;color:#118a31}.kakao{background:#fff6c7;color:#6c5d00}.mrblue{background:#eaf0ff;color:#2b4f98}.memo{font-size:11px;color:#7d8290;margin-top:7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.actions{grid-column:1/-1;display:flex;gap:7px}.open,.mini{flex:1;text-align:center;border-radius:10px;padding:9px 8px;font-size:12px;font-weight:800;text-decoration:none}.open{background:#1b1e29;color:#fff;border:0}.mini{background:#fff;color:#616674;border:1px solid var(--line)}.mini:disabled{opacity:.5}.empty{grid-column:1/-1;background:#fff;border:1px dashed #d6d8e2;border-radius:18px;padding:42px 18px;text-align:center;color:#777d8a}.foot{text-align:center;color:#9a9eaa;font-size:11px;margin:28px 0}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;transition:.2s;background:#1c1f2b;color:#fff;padding:11px 15px;border-radius:12px;font-size:13px;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}dialog{border:0;border-radius:20px;width:min(680px,calc(100% - 24px));padding:0;box-shadow:0 24px 70px rgba(0,0,0,.28)}dialog::backdrop{background:rgba(14,16,24,.55)}.dh{display:flex;justify-content:space-between;align-items:center;padding:18px 20px 12px;border-bottom:1px solid var(--line)}.dh h3{margin:0}.x{border:0;background:none;font-size:24px;color:#777}form{padding:18px 20px 20px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:12px}.field label{display:block;font-size:12px;font-weight:800;color:#666b78;margin-bottom:5px}.field input,.field select,.field textarea{width:100%;border:1px solid #dfe1e8;border-radius:10px;padding:10px 11px;outline:none}.field textarea{min-height:66px}.platbox{border:1px solid var(--line);border-radius:13px;padding:10px;margin:8px 0}.plathead{display:flex;justify-content:space-between;align-items:center;font-weight:800}.platfields{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.platfields .url{grid-column:1/-1}.actions2{display:flex;justify-content:flex-end;gap:8px;margin-top:15px}.save{border:0;border-radius:10px;background:#1d202d;color:#fff;padding:10px 15px;font-weight:800}.danger{border:1px solid #efcaca;color:#c94343;background:#fff;border-radius:10px;padding:10px 13px}.privacy{font-size:10px;color:#9297a3;margin-top:7px}@media(max-width:720px){.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.searchrow{grid-template-columns:1fr}.primary{height:46px}.row{grid-template-columns:1fr}.platfields{grid-template-columns:1fr}.platfields .url{grid-column:auto}}
</style>
</head>
<body>
<header class="hero"><div class="wrap"><div class="brand"><div class="logo">책</div><div><h1>내 소장도서관</h1><div class="sub">리디 · 시리즈 · 카카오페이지 · 미스터블루 통합 서재</div></div></div><div class="searchrow"><input id="search" class="search" placeholder="작품명 또는 작가를 검색하세요"><button id="add" class="primary">＋ 작품 등록</button></div></div></header>
<main class="main"><section class="stats"><div class="stat"><div id="nAll" class="num">0</div><div class="lab">등록 작품</div></div><div class="stat"><div id="nFull" class="num">0</div><div class="lab">전권 소장</div></div><div class="stat"><div id="nRead" class="num">0</div><div class="lab">읽는 중</div></div><div class="stat"><div id="nDone" class="num">0</div><div class="lab">완독</div></div></section><div class="notice"><b>공유 → 자동 등록</b><br>웹소설 앱의 공유 메뉴에서 내 소장도서관을 고르면 작품명·플랫폼·원문 링크를 저장하고, 가능한 경우 작가·표지도 자동 보강합니다.<div class="privacy">자동 정보 보강 시 공유한 작품 URL만 Microlink 공개 메타데이터 API로 전송됩니다. 계정·로그인 정보는 전송하지 않습니다.</div></div><div class="toolbar"><div id="pf" class="filters"><button class="chip on" data-p="all">전체</button><button class="chip" data-p="리디">리디</button><button class="chip" data-p="시리즈">시리즈</button><button class="chip" data-p="카카오페이지">카카오페이지</button><button class="chip" data-p="미스터블루">미스터블루</button></div><div class="tools"><button id="backup" class="ghost">백업</button><label class="ghost" style="cursor:pointer">가져오기<input id="restore" type="file" accept="application/json,.json" hidden></label></div></div><div id="sf" class="filters"><button class="chip on" data-s="all">상태 전체</button><button class="chip" data-s="안 읽음">안 읽음</button><button class="chip" data-s="읽는 중">읽는 중</button><button class="chip" data-s="완독">완독</button><button class="chip" data-s="재탕 예정">재탕 예정</button></div><div class="titlebar"><h2>내 작품</h2><span id="count" class="count"></span></div><section id="grid" class="grid"></section><div class="foot">콘텐츠는 원 서비스에서 열립니다 · 개인용 소장목록 v0.4</div></main>
<dialog id="dlg"><div class="dh"><h3 id="dlgTitle">작품 등록</h3><button class="x" onclick="dlg.close()">×</button></div><form id="form"><input id="id" type="hidden"><div class="row"><div class="field"><label>작품명</label><input id="title" required></div><div class="field"><label>작가</label><input id="author" placeholder="자동으로 못 찾았을 때만 입력"></div></div><div class="row"><div class="field"><label>종류</label><select id="type"><option>웹소설</option><option>웹툰</option><option>만화</option><option>e북</option></select></div><div class="field"><label>상태</label><select id="status"><option>안 읽음</option><option>읽는 중</option><option>완독</option><option>재탕 예정</option></select></div></div><div class="field"><label>표지 URL</label><input id="cover"></div><div class="field"><label>메모</label><textarea id="memo"></textarea></div><div id="plats"></div><div class="actions2"><button id="del" type="button" class="danger">삭제</button><button class="save">저장</button></div></form></dialog>
<div id="toast" class="toast"></div>
<script>
const KEY='myOwnedLibrary_v1',P=['리디','시리즈','카카오페이지','미스터블루'],PC={'리디':'ridi','시리즈':'series','카카오페이지':'kakao','미스터블루':'mrblue'};let books=[],pf='all',sf='all';const $=q=>document.querySelector(q),dlg=$('#dlg');
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}function esc(v=''){return String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function note(m){let e=$('#toast');e.textContent=m;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}function save(){localStorage.setItem(KEY,JSON.stringify(books));render()}function norm(u=''){try{let x=new URL(u.trim());x.hash='';return x.toString()}catch{return u.trim()}}
function plat(u=''){u=String(u).toLowerCase();if(/ridibooks\.com|ridi\.com|ridi\.page\.link/.test(u))return'리디';if(/series\.naver\.com|naver\.me/.test(u))return'시리즈';if(/page\.kakao\.com|kakaopage|kko\.to/.test(u))return'카카오페이지';if(/mrblue\.com/.test(u))return'미스터블루';return''}
function pickUrl(...vals){for(const v of vals){let m=String(v||'').match(/https?:\/\/[^\s<>\"']+/i);if(m)return norm(m[0].replace(/[),.\]]+$/,''))}return''}
function cleanTitle(st='',sx='',url='',p=''){for(let c of [st,...String(sx).split(/\r?\n/)]){c=String(c||'').trim();if(!c)continue;c=c.replace(/https?:\/\/\S+/g,'').trim().replace(/^\[?(리디|RIDIBOOKS|네이버\s*시리즈|시리즈|카카오페이지|미스터블루)\]?\s*[-|:]?\s*/i,'').replace(/\s*[-|·:]\s*(리디|RIDIBOOKS|네이버\s*시리즈|시리즈|카카오페이지|미스터블루).*$/i,'').trim();if(c.length>1&&!/^(공유|share|링크)$/i.test(c))return c}return`제목 확인 필요 · ${p||'공유 작품'}`}
function sharedAuthor(st='',sx=''){let r=`${sx}\n${st}`;for(const re of [/(?:작가|저자|글쓴이)\s*[:：]?\s*([^\n|]{1,50})/i,/(?:글\s*[·&/]?\s*그림|글|원작)\s*[:：]?\s*([^\n|]{1,50})/i,/\bby\s+([^\n|]{1,50})/i]){let m=r.match(re);if(m){let a=m[1].replace(/https?:\/\/\S+/g,'').trim();if(a&&a.length<50)return a}}return''}
function migrate(){let changed=false;for(const b of books){b.platforms=b.platforms||[];if(!b.sourceUrl&&b.memo){let u=pickUrl(b.memo);if(u){b.sourceUrl=u;let p=plat(u);if(p&&!b.platforms.some(x=>x.name===p))b.platforms.push({name:p,ownership:'소장(범위 미확인)',range:'',url:u});b.memo=b.memo.replace(/\s*·?\s*링크:\s*https?:\/\/\S+/,'').trim();changed=true}}}if(changed)localStorage.setItem(KEY,JSON.stringify(books))}
function mergeShare({title,author,url,platform}){let now=new Date().toISOString(),u=norm(url),i=u?books.findIndex(b=>norm(b.sourceUrl||'')===u||(b.platforms||[]).some(x=>norm(x.url||'')===u)):-1;if(i<0)i=books.findIndex(b=>b.title.trim().toLowerCase()===title.trim().toLowerCase());let b;if(i>=0)b=books[i];else{b={id:uid(),title,author:'',type:'웹소설',status:'안 읽음',memo:'공유로 자동 등록',cover:'',sourceUrl:u,platforms:[],updatedAt:now};books.unshift(b)}b.sourceUrl=u||b.sourceUrl||'';if(author&&!b.author)b.author=author;if(platform){let x=b.platforms.find(x=>x.name===platform);if(x)x.url=u||x.url;else b.platforms.push({name:platform,ownership:'소장(범위 미확인)',range:'',url:u})}b.updatedAt=now;b.lastSharedAt=now;save();return b}
function metaTitle(t='',p=''){return t.replace(/\s*[:|\-]\s*(네이버\s*시리즈|시리즈|RIDI|리디|카카오페이지|미스터블루).*$/i,'').trim()}
function authorFromDesc(d=''){for(const re of [/(?:작가|저자|글)\s*[:：]?\s*([가-힣A-Za-z0-9_()·.]{2,30})/,/\|\s*([가-힣A-Za-z0-9_()·.]{2,30})\s*\|/]){let m=String(d).match(re);if(m)return m[1]}return''}
async function enrich(b,loud=false){let u=b.sourceUrl||(b.platforms||[]).find(x=>x.url)?.url;if(!u){if(loud)note('원문 링크가 없어 정보를 가져올 수 없습니다');return}if(loud)note('작품 정보를 가져오는 중…');try{let r=await fetch('https://api.microlink.io/?url='+encodeURIComponent(u));let j=await r.json();if(!r.ok||j.status!=='success')throw 0;let d=j.data||{},cu=norm(d.url||u),p=plat(cu)||plat(u);b.sourceUrl=cu;let pt=metaTitle(d.title||'',p);if(pt&&(!b.title||b.title.startsWith('제목 확인 필요')))b.title=pt;let a=d.author||authorFromDesc(d.description||'');if(a&&!b.author)b.author=a;if(d.image?.url&&!b.cover)b.cover=d.image.url;if(p){let x=(b.platforms||[]).find(x=>x.name===p);if(x)x.url=cu;else(b.platforms||(b.platforms=[])).push({name:p,ownership:'소장(범위 미확인)',range:'',url:cu})}b.updatedAt=new Date().toISOString();save();if(loud)note(b.author?'작가·링크 정보를 보강했습니다':'링크·표지 정보를 보강했습니다')}catch{if(loud)note('자동 정보 조회가 막혀 기본 정보만 유지합니다')}}
async function handleShare(){let q=new URLSearchParams(location.search),st=q.get('share_title')||'',sx=q.get('share_text')||'',su=q.get('share_url')||'';if(!(st||sx||su))return;let u=pickUrl(su,sx,st),p=plat(u||sx||st),t=cleanTitle(st,sx,u,p),a=sharedAuthor(st,sx),b=mergeShare({title:t,author:a,url:u,platform:p});history.replaceState({},'',location.pathname);note(`「${t}」 등록 완료`);await enrich(b,false)}
function list(){let q=$('#search').value.trim().toLowerCase();return books.filter(b=>(!q||`${b.title} ${b.author||''}`.toLowerCase().includes(q))&&(pf==='all'||(b.platforms||[]).some(x=>x.name===pf))&&(sf==='all'||b.status===sf)).sort((a,b)=>(b.updatedAt||'').localeCompare(a.updatedAt||''))}
function render(){migrate();$('#nAll').textContent=books.length;$('#nFull').textContent=books.filter(b=>(b.platforms||[]).some(x=>x.ownership==='전권 소장')).length;$('#nRead').textContent=books.filter(b=>b.status==='읽는 중').length;$('#nDone').textContent=books.filter(b=>b.status==='완독').length;let a=list();$('#count').textContent=a.length+'개';$('#grid').innerHTML=a.length?a.map(b=>{let badges=(b.platforms||[]).map(x=>`<span class="badge ${PC[x.name]||''}">${esc(x.name)}${x.range?' · '+esc(x.range):''}</span>`).join(''),links=(b.platforms||[]).filter(x=>x.url).slice(0,2).map(x=>`<a class="open" href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.name)}에서 열기</a>`).join('');if(!links&&b.sourceUrl)links=`<a class="open" href="${esc(b.sourceUrl)}" target="_blank" rel="noopener">원문에서 열기</a>`;return`<article class="card"><div class="cover">${b.cover?`<img src="${esc(b.cover)}" alt="">`:''}<span>${esc(b.title)}</span></div><div class="meta"><div class="ttl">${esc(b.title)}</div><div class="author">${esc(b.author||'작가 정보 확인 필요')} · ${esc(b.type||'웹소설')}</div><div class="badges"><span class="badge">${esc(b.status||'안 읽음')}</span>${badges}</div>${b.memo?`<div class="memo">${esc(b.memo)}</div>`:''}</div><div class="actions">${links||'<button class="mini" disabled>링크 없음</button>'}<button class="mini" onclick="enrichById('${b.id}')">정보 보강</button><button class="mini" onclick="edit('${b.id}')">수정</button></div></article>`}).join(''):'<div class="empty">아직 등록된 작품이 없습니다.<br>원 앱에서 작품을 공유해 보세요.</div>'}
function platEditor(ex=[]){return P.map(n=>{let p=ex.find(x=>x.name===n)||{},on=!!p.name;return`<div class="platbox" data-n="${n}"><div class="plathead"><label><input class="ck" type="checkbox" ${on?'checked':''}> ${n}</label><span class="badge ${PC[n]}">${n}</span></div><div class="platfields" style="display:${on?'grid':'none'}"><select class="own"><option ${p.ownership==='전권 소장'?'selected':''}>전권 소장</option><option ${p.ownership==='일부 소장'?'selected':''}>일부 소장</option><option ${p.ownership==='소장(범위 미확인)'?'selected':''}>소장(범위 미확인)</option><option ${p.ownership==='대여'?'selected':''}>대여</option></select><input class="rng" placeholder="예: 1~72화" value="${esc(p.range||'')}"><input class="url" placeholder="작품 페이지 URL" value="${esc(p.url||'')}"></div></div>`}).join('')}
function bind(){document.querySelectorAll('.platbox').forEach(b=>b.querySelector('.ck').onchange=e=>b.querySelector('.platfields').style.display=e.target.checked?'grid':'none')}
function openNew(){$('#dlgTitle').textContent='작품 등록';['id','title','author','cover','memo'].forEach(x=>$('#'+x).value='');$('#type').value='웹소설';$('#status').value='안 읽음';$('#plats').innerHTML=platEditor();$('#del').style.display='none';bind();dlg.showModal()}
window.edit=id=>{let b=books.find(x=>x.id===id);if(!b)return;$('#dlgTitle').textContent='작품 수정';$('#id').value=b.id;$('#title').value=b.title;$('#author').value=b.author||'';$('#type').value=b.type||'웹소설';$('#status').value=b.status||'안 읽음';$('#cover').value=b.cover||'';$('#memo').value=b.memo||'';$('#plats').innerHTML=platEditor(b.platforms||[]);$('#del').style.display='inline-block';bind();dlg.showModal()};window.enrichById=id=>{let b=books.find(x=>x.id===id);if(b)enrich(b,true)}
$('#form').onsubmit=e=>{e.preventDefault();let id=$('#id').value||uid(),old=books.find(x=>x.id===id),ps=[...document.querySelectorAll('.platbox')].filter(x=>x.querySelector('.ck').checked).map(x=>({name:x.dataset.n,ownership:x.querySelector('.own').value,range:x.querySelector('.rng').value.trim(),url:x.querySelector('.url').value.trim()})),b={...(old||{}),id,title:$('#title').value.trim(),author:$('#author').value.trim(),type:$('#type').value,status:$('#status').value,cover:$('#cover').value.trim(),memo:$('#memo').value.trim(),platforms:ps,sourceUrl:old?.sourceUrl||ps.find(x=>x.url)?.url||'',updatedAt:new Date().toISOString()};let i=books.findIndex(x=>x.id===id);if(i>=0)books[i]=b;else books.push(b);save();dlg.close();note('저장했습니다')};$('#del').onclick=()=>{let id=$('#id').value;if(id&&confirm('이 작품을 삭제할까요?')){books=books.filter(x=>x.id!==id);save();dlg.close()}};$('#add').onclick=openNew;$('#search').oninput=render;$('#pf').onclick=e=>{if(!e.target.dataset.p)return;document.querySelectorAll('#pf .chip').forEach(x=>x.classList.remove('on'));e.target.classList.add('on');pf=e.target.dataset.p;render()};$('#sf').onclick=e=>{if(!e.target.dataset.s)return;document.querySelectorAll('#sf .chip').forEach(x=>x.classList.remove('on'));e.target.classList.add('on');sf=e.target.dataset.s;render()};$('#backup').onclick=()=>{let blob=new Blob([JSON.stringify({version:4,books},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='내소장도서관.json';a.click();URL.revokeObjectURL(a.href)};$('#restore').onchange=async e=>{try{let j=JSON.parse(await e.target.files[0].text()),arr=Array.isArray(j)?j:j.books||[];for(const b of arr)if(b.title&&!books.some(x=>x.title===b.title&&x.author===b.author))books.push({...b,id:b.id||uid()});save();note('가져왔습니다')}catch{note('백업 파일을 확인해주세요')}};
try{books=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{books=[]}migrate();render();handleShare();if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
